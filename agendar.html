<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agendar · Os Barbeiros JF</title>
<meta name="description" content="Escolha o serviço, o dia e o horário na Barbearia Os Barbeiros JF.">
<link rel="icon" href="fotos/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<style>
  .hero-b { text-align: center; padding: 28px 0 8px; }
  .hero-b img { width: 104px; height: 104px; border-radius: 22px; margin: 0 auto 12px; box-shadow: var(--glow); }
  .hero-b h1 { font-size: 1.8rem; }
  .passos { display: flex; gap: 6px; margin: 22px 0; }
  .passos span { flex: 1; height: 4px; border-radius: 4px; background: var(--line); transition: background .3s; }
  .passos span.on { background: var(--blue); box-shadow: var(--glow); }
  .etapa h2 { margin-bottom: 4px; }
  .opcoes { display: grid; gap: 10px; margin-top: 14px; }
  .opcao { display: flex; align-items: center; gap: 14px; text-align: left; width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; color: var(--text); font: inherit; cursor: pointer; transition: border-color .2s, transform .12s; }
  .opcao:hover { border-color: var(--blue); transform: translateY(-1px); }
  .opcao b { display: block; }
  .opcao .preco { margin-left: auto; text-align: right; color: var(--blue-light); font-family: Oswald, sans-serif; font-size: 1.2rem; white-space: nowrap; }
  .dias { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 12px; margin-top: 14px; scrollbar-width: thin; }
  .dia { flex: none; width: 64px; padding: 10px 0; border-radius: 12px; background: var(--card); border: 1px solid var(--line); color: var(--text); text-align: center; cursor: pointer; font: inherit; }
  .dia small { display: block; color: var(--muted); font-size: .72rem; text-transform: uppercase; }
  .dia b { font-family: Oswald, sans-serif; font-size: 1.4rem; display: block; line-height: 1.2; }
  .dia.sel { background: var(--blue); border-color: var(--blue); }
  .dia.sel small { color: #dbe7ff; }
  .dia:disabled { opacity: .3; cursor: not-allowed; }
  .horas { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; margin-top: 14px; }
  .hora { padding: 11px 0; border-radius: 10px; background: var(--card); border: 1px solid var(--line); color: var(--text); font: inherit; font-weight: 600; cursor: pointer; }
  .hora:hover { border-color: var(--blue); }
  .resumo { background: var(--card-2); border-radius: 12px; padding: 14px 16px; margin: 14px 0; display: grid; gap: 4px; }
  .resumo div { display: flex; justify-content: space-between; gap: 12px; }
  .resumo span { color: var(--muted); }
  .aviso { background: rgba(47,123,255,.1); border: 1px solid rgba(47,123,255,.35); border-radius: 12px; padding: 12px 14px; font-size: .9rem; color: #c7d8ff; margin-bottom: 14px; }
  .voltar { background: none; border: 0; color: var(--muted); font: inherit; cursor: pointer; margin-top: 18px; }
  .voltar:hover { color: var(--text); }
  .sucesso { text-align: center; }
  .sucesso .ok { width: 72px; height: 72px; border-radius: 50%; background: rgba(37,211,102,.15); color: #25d366; display: grid; place-items: center; font-size: 2rem; margin: 0 auto 14px; }
  footer { text-align: center; color: var(--muted); font-size: .8rem; padding: 40px 0 24px; }
</style>
</head>
<body>
<main class="wrap estreito">
  <div class="hero-b">
    <a href="./"><img src="fotos/logo.jpg" alt="Os Barbeiros JF"></a>
    <h1>Os Barbeiros JF</h1>
    <p class="muted small">R. Diogo Álvares, 389 – Loja 1 · Benfica, Juiz de Fora</p>
    <p class="small mt"><a href="./">← voltar ao site</a></p>
  </div>
  <div class="passos" id="passos"><span></span><span></span><span></span></div>
  <div id="app"></div>
</main>
<footer>Seg–Sex 08:00–20:00 · Sáb 08:00–16:00</footer>

<script src="js/comum.js"></script>
<script>
// ============ CONFIGURAÇÃO — edite aqui ============
const BARBEARIA = {
  nome: "Os Barbeiros JF",
  whatsapp: "32991234073",
  fuso: "America/Sao_Paulo",
  intervaloMin: 30,        // de quanto em quanto tempo aparecem os horários
  antecedenciaMin: 60,     // não mostra horários que começam em menos de 1h
  diasAbertos: 30,         // até quantos dias à frente dá para escolher
  // 0 = domingo ... 6 = sábado. Várias faixas no mesmo dia = pausa (ex.: almoço).
  jornada: {
    1: [["08:00", "20:00"]], 2: [["08:00", "20:00"]], 3: [["08:00", "20:00"]],
    4: [["08:00", "20:00"]], 5: [["08:00", "20:00"]], 6: [["08:00", "16:00"]],
  },
};
const SERVICOS = [
  { nome: "Máquina geral", descricao: "Corte todo na máquina, prático e alinhado.", preco: 25, duracao: 30 },
  { nome: "Disfarçado",    descricao: "Degradê na régua, do mais baixo ao mais marcado.", preco: 35, duracao: 40 },
  { nome: "Tesoura",       descricao: "Corte na tesoura para volume e caimento natural.", preco: 35, duracao: 40 },
  { nome: "Barba",         descricao: "Barba desenhada e alinhada, do jeito que você gosta.", preco: 25, duracao: 30 },
  { nome: "Sobrancelha",   descricao: "Limpeza e alinhamento da sobrancelha.", preco: 10, duracao: 10 },
  { nome: "Pezinho",       descricao: "Acabamento rápido entre um corte e outro.", preco: 10, duracao: 10 },
];
// ====================================================

// MVP sem servidor: o cliente monta o pedido e envia pelo WhatsApp; o barbeiro confirma por lá.
(() => {
  const app = $("#app");
  const st = { servico: null, data: null, hora: null };
  const passo = n => $$("#passos span").forEach((s, i) => s.classList.toggle("on", i < n));
  const minutos = h => { const [a, b] = h.split(":").map(Number); return a * 60 + b; };
  const hhmm = m => `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;

  function horariosDoDia(d) {
    const faixas = BARBEARIA.jornada[diaSemana(d)] || [];
    const limite = Date.now() + BARBEARIA.antecedenciaMin * 60000;
    const lista = [];
    for (const [ini, fim] of faixas)
      for (let m = minutos(ini); m + st.servico.duracao <= minutos(fim); m += BARBEARIA.intervaloMin)
        if (dataHoraNoFuso(d, hhmm(m), BARBEARIA.fuso).getTime() >= limite) lista.push(hhmm(m));
    return lista;
  }

  function telaServico() {
    passo(1);
    app.innerHTML = `<section class="etapa"><h2>Qual serviço?</h2>
      <div class="opcoes">${SERVICOS.map((s, i) => `
        <button class="opcao" data-i="${i}">
          <div><b>${esc(s.nome)}</b><span class="muted small">${esc(s.descricao)}</span></div>
          <div class="preco">${dinheiro(s.preco)}</div>
        </button>`).join("")}</div></section>`;
    $$(".opcao", app).forEach(b => b.onclick = () => { st.servico = SERVICOS[b.dataset.i]; telaHorario(); });
  }

  function telaHorario() {
    passo(2);
    const hoje = hojeNoFuso(BARBEARIA.fuso);
    const dias = Array.from({ length: BARBEARIA.diasAbertos + 1 }, (_, i) => somaDias(hoje, i));
    app.innerHTML = `<section class="etapa">
      <h2>Quando?</h2>
      <p class="muted small">${esc(st.servico.nome)} · ${dinheiro(st.servico.preco)}</p>
      <div class="dias">${dias.map(d => {
        const f = fmtDataCurta(d), aberto = !!BARBEARIA.jornada[diaSemana(d)];
        return `<button class="dia" data-d="${d}" ${aberto ? "" : "disabled"}><small>${f.semana}</small><b>${f.dia}</b><small>${f.mes}</small></button>`;
      }).join("")}</div>
      <div id="horas"></div>
      <button class="voltar">← trocar serviço</button></section>`;
    $(".voltar", app).onclick = telaServico;
    const botoes = $$(".dia:not(:disabled)", app);
    botoes.forEach(b => b.onclick = () => escolherDia(b.dataset.d));
    const comHorario = botoes.find(b => b.dataset.d === st.data) || botoes.find(b => horariosDoDia(b.dataset.d).length);
    if (comHorario) escolherDia(comHorario.dataset.d);
  }

  function escolherDia(d) {
    st.data = d;
    $$(".dia", app).forEach(b => b.classList.toggle("sel", b.dataset.d === d));
    $(`.dia[data-d="${d}"]`, app)?.scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" });
    const horas = horariosDoDia(d);
    $("#horas").innerHTML = horas.length
      ? `<div class="horas">${horas.map(h => `<button class="hora">${h}</button>`).join("")}</div>`
      : `<div class="vazio">Sem horários neste dia. Escolha outro.</div>`;
    $$(".hora", app).forEach(b => b.onclick = () => { st.hora = b.textContent; telaDados(); });
  }

  function telaDados() {
    passo(3);
    const quando = `${fmtDataLonga(dataHoraNoFuso(st.data, st.hora, BARBEARIA.fuso), BARBEARIA.fuso)}, ${st.hora}`;
    const salvo = guarda.ler("ob_cliente", {});
    app.innerHTML = `<section class="etapa">
      <h2>Quase lá</h2>
      <div class="resumo">
        <div><span>Serviço</span><b>${esc(st.servico.nome)}</b></div>
        <div><span>Quando</span><b>${esc(quando)}</b></div>
        <div><span>Valor</span><b>${dinheiro(st.servico.preco)}</b></div>
      </div>
      <div class="aviso">📲 Ao enviar, abrimos o WhatsApp da barbearia com o pedido pronto. O horário fica garantido quando o Gabriel confirmar por lá.</div>
      <form id="f">
        <div class="campo"><label for="nome">Seu nome</label><input id="nome" required minlength="2" maxlength="80" autocomplete="name" value="${esc(salvo.nome || "")}"></div>
        <div class="campo"><label for="obs">Observação (opcional)</label><textarea id="obs" rows="2" maxlength="300" placeholder="Ex.: quero bem baixinho dos lados"></textarea></div>
        <button class="btn btn-green btn-block">💬 Enviar pedido pelo WhatsApp</button>
      </form>
      <button class="voltar">← trocar horário</button></section>`;
    $(".voltar", app).onclick = telaHorario;
    $("#f").onsubmit = ev => {
      ev.preventDefault();
      const nome = $("#nome").value.trim(), obs = $("#obs").value.trim();
      guarda.gravar("ob_cliente", { nome });
      const msg = `Olá! Quero agendar pelo site 💈\n\n*${st.servico.nome}* (${dinheiro(st.servico.preco)})\n📅 ${quando}\n👤 ${nome}` + (obs ? `\n📝 ${obs}` : "") + `\n\nEsse horário está livre?`;
      window.open(linkWhats(BARBEARIA.whatsapp, msg), "_blank", "noopener");
      telaEnviado(quando);
    };
  }

  function telaEnviado(quando) {
    app.innerHTML = `<section class="sucesso">
      <div class="ok">✓</div>
      <h2>Pedido enviado!</h2>
      <p class="muted">${esc(st.servico.nome)} · <b style="color:var(--text)">${esc(quando)}</b></p>
      <p class="muted small mt">Se o WhatsApp não abriu, toque no botão abaixo. A confirmação chega por lá.</p>
      <div class="opcoes mt2">
        <a class="btn btn-green" target="_blank" rel="noopener" href="${linkWhats(BARBEARIA.whatsapp)}">Abrir WhatsApp da barbearia</a>
        <a class="btn btn-ghost" href="./">Voltar ao site</a>
      </div>
      <button class="voltar" id="novo">Agendar outro serviço</button></section>`;
    $("#novo").onclick = () => { Object.assign(st, { servico: null, data: null, hora: null }); telaServico(); };
  }

  telaServico();
})();
</script>
</body>
</html>
